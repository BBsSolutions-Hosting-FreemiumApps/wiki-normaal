<h2>Hoe deze wiki de legenda gebruikt</h2>
<ol class="how">
<li>De bijbeltekst wordt getoond met de kleuren uit het RTF-bronbestand. U kunt de kleuren uitzetten met de knop “Kleuren” bij het lezen.</li>
<li>Namen zijn klikbaar (stippellijn). De soort wordt vooral bepaald door de legendakleur: <b style="color:#000">zwart vet</b> = stad, <i style="color:#000">zwart cursief</i> = rivier, meer, zee of regio, <b><span style="color:#fd8008">o</span><span style="color:#00f">ranje beginletter</span></b> = koningsnaam, <b><span style="color:#fb02ff">m</span><span style="color:#00f">agenta beginletter</span></b> = profetennaam, lichtblauwe achtergrond = priester.</li>
<li>Waar de kleur niets zegt, kijkt de wiki naar de zin zelf (“zoon van …”, “koning van …”, “het land …”, “rivier …”). Elke popup laat zien waarop de indeling berust en hoe zeker die is.</li>
<li>De codes [E], [Y], [§], [!], [?] enzovoort tonen bij aantikken hun betekenis.</li>
</ol>
